<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoRecicla</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <h1>🌱 EcoRecicla</h1>
  <nav>
    <a href="#inicio">Inicio</a>
    <a href="#info">Información</a>
    <a href="#calculadora">Calculadora</a>
    <a href="#contacto">Contacto</a>
  </nav>
</header>

<section id="inicio" class="hero">
  <h2>Reciclar es cuidar el planeta</h2>
  <p>Aprende, calcula tu impacto y contribuye al medio ambiente</p>
</section>

<section id="info">
  <h2>¿Qué reciclar?</h2>
  <div class="cards">
    <div class="card">♻️ Plástico</div>
    <div class="card">📄 Papel</div>
    <div class="card">🍾 Vidrio</div>
    <div class="card">🔩 Metal</div>
  </div>
</section>

<section id="calculadora">
  <h2>Calcula tu impacto</h2>
  <input type="number" id="kg" placeholder="Kg reciclados">
  <button onclick="calcularImpacto()">Calcular</button>
  <p id="resultado"></p>
</section>

<section id="contacto">
  <h2>Contacto</h2>
  <form>
    <input type="text" placeholder="Nombre" required>
    <input type="email" placeholder="Correo" required>
    <textarea placeholder="Mensaje"></textarea>
    <button type="submit">Enviar</button>
  </form>
</section>

<footer>
  <p>© 2026 EcoRecicla</p>
</footer>

<script src="script.js"></script>
</body>
</html>
