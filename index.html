<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>URT Industrial SPA</title>

  <!-- CSS -->
  <link rel="stylesheet" href="styles.css">

  <!-- ICONOS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<section id="info" class="section">
  <h2>Nuestros Servicios</h2>

  <div class="cards">

    <div class="card">
      <i class="fas fa-industry"></i>
      <h3>Gestión de Residuos</h3>
      <p>Recolección y disposición certificada</p>
    </div>

    <div class="card">
      <i class="fas fa-file-contract"></i>
      <h3>Normativa</h3>
      <p>Cumplimiento ambiental y legal</p>
    </div>

    <div class="card">
      <i class="fas fa-recycle"></i>
      <h3>Valorización</h3>
      <p>Reutilización industrial eficiente</p>
    </div>

    <div class="card">
      <i class="fas fa-chart-line"></i>
      <h3>Trazabilidad</h3>
      <p>Seguimiento y reportes completos</p>
    </div>

  </div>
</section>

<section id="calculadora" class="section dark">
  <h2>Evaluación de Residuos</h2>
  <input type="number" id="kg" placeholder="Kg mensuales">
  <button onclick="calcular()">Evaluar</button>
  <p id="resultado"></p>
</section>

<section id="contacto" class="section">
  <h2>Contacto Comercial</h2>
  <form onsubmit="enviar(event)">
    <input type="text" placeholder="Empresa" required>
    <input type="email" placeholder="Correo" required>
    <textarea placeholder="Requerimiento"></textarea>
    <button type="submit">Enviar</button>
  </form>
</section>

<footer>
  <p>© 2026 URT Industrial SPA</p>

  <div class="social-footer">
    <a href="#"><i class="fab fa-facebook-f"></i></a>
    <a href="#"><i class="fab fa-instagram"></i></a>
    <a href="#"><i class="fab fa-linkedin-in"></i></a>
  </div>
</footer>

<script src="script.js"></script>

</body>
</html>
