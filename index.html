<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URT Industrial SPA</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
  --primary:#0F2A32;
  --secondary:#1E5F74;
  --accent:#00A878;
  --accent-soft:#6ED3B1;
  --dark:#0A1A1F;
  --light:#F2F5F6;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Poppins',sans-serif;
  background:var(--light);
}

/* HEADER */
header{
  position:fixed;
  width:100%;
  top:0;
  left:0;
  z-index:2000;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 25px;
  background:transparent;
  transition:0.3s;
}

header.scrolled{
  background:rgba(10,26,31,0.95);
  backdrop-filter:blur(10px);
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo img{width:40px;}
.logo span{color:white;font-weight:600;}

nav{
  display:flex;
  gap:20px;
}

nav a{
  color:white;
  text-decoration:none;
}

/* HAMBURGUESA */
.menu-toggle{
  display:none;
  font-size:1.6rem;
  color:white;
  cursor:pointer;
  z-index:2100;
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  color:white;
  padding:0 20px;

  background:linear-gradient(rgba(10,26,31,0.85), rgba(10,26,31,0.95)),
  url('https://images.unsplash.com/photo-1581091870627-3a5b7f0f7b63');
  background-size:cover;
}

.hero h2{
  font-size:2.5rem;
}

.hero p{
  margin-top:10px;
}

.btn{
  margin-top:20px;
  display:inline-block;
  padding:12px 25px;
  border-radius:30px;
  background:var(--accent);
  color:white;
  text-decoration:none;
}

/* SECCIONES */
.section{
  padding:60px 20px;
  text-align:center;
}

.dark{
  background:var(--dark);
  color:white;
}

/* CARDS */
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  margin-top:30px;
}

.card{
  background:white;
  padding:20px;
  border-radius:10px;
  cursor:pointer;
}

/* SOCIAL */
.social-floating{
  position:fixed;
  top:50%;
  right:10px;
  transform:translateY(-50%);
  display:flex;
  flex-direction:column;
  gap:10px;
  z-index:1500;
}

.social-floating a{
  width:40px;
  height:40px;
  display:flex;
  justify-content:center;
  align-items:center;
  background:white;
  border-radius:50%;
}

/* MOBILE */
@media(max-width:768px){

  .menu-toggle{
    display:block;
  }

  nav{
    position:fixed;
    top:0;
    right:0;
    width:70%;
    height:100vh;
    background:var(--dark);
    flex-direction:column;
    justify-content:center;
    align-items:center;
    transform:translateX(100%);
    transition:0.3s;
    z-index:2000;
  }

  nav.active{
    transform:translateX(0);
  }

  .hero{
    height:auto;
    padding:120px 20px 60px;
  }

  .hero h2{
    font-size:1.6rem;
  }
}
</style>
</head>

<body>

<div class="social-floating">
<a href="#"><i class="fab fa-linkedin-in"></i></a>
<a href="#"><i class="fab fa-whatsapp"></i></a>
<a href="#"><i class="fab fa-instagram"></i></a>
</div>

<header id="header">
<div class="logo">
<img src="logo.jpeg">
<span>URT Industrial</span>
</div>

<nav id="nav">
<a href="#inicio">Inicio</a>
<a href="#info">Servicios</a>
<a href="#contacto">Contacto</a>
</nav>

<div class="menu-toggle" id="menu-toggle">
<i class="fas fa-bars"></i>
</div>
</header>

<section class="hero" id="inicio">
<div>
<h2>Gestión Integral de Excedentes Industriales</h2>
<p>Soluciones para tratamiento y valorización</p>
<a href="#contacto" class="btn">Solicitar asesoría</a>
</div>
</section>

<section class="section" id="info">
<h2>Servicios</h2>
<div class="cards">
<div class="card">Gestión de residuos</div>
<div class="card">Normativa ambiental</div>
<div class="card">Valorización</div>
<div class="card">Trazabilidad</div>
</div>
</section>

<section class="section dark" id="contacto">
<h2>Contacto</h2>
</section>

<script>
const toggle=document.getElementById('menu-toggle');
const nav=document.getElementById('nav');
const header=document.getElementById('header');

toggle.addEventListener('click',()=>{
  nav.classList.toggle('active');
});

/* cerrar menú */
document.querySelectorAll('nav a').forEach(link=>{
  link.addEventListener('click',()=>{
    nav.classList.remove('active');
  });
});

/* header scroll */
window.addEventListener('scroll',()=>{
  if(window.scrollY>50){
    header.classList.add('scrolled');
  }else{
    header.classList.remove('scrolled');
  }
});
</script>

</body>
</html>
